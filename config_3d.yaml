benchmark: "3d"
seed: 42

data:
  h5_path: "./data/gaussian_3d.h5"
  n_gaussians: 24
  n_params: 48          # n_gaussians * 2  —  (amplitude, sigma) per Gaussian
                        # centers are fixed at generation time, not part of the input
  spatial_dim: 3
  grid_res: 15          # grid is grid_res^3 = 3375 nodes
  samples:
    train: 1000
    val:   200
    test:  100
  use_subset: false

training:
  batch_size: 32
  epochs: 400
  lr: 1.0e-3
  weight_decay: 1.0e-3
  patience: 30
  grad_loss_weight: 0.0 # gradient loss is not meaningful on an unstructured 3-D mesh

model:
  # ── Recommended for 3-D fixed-mesh with ≤1 000 training samples ─────────
  # POD_MLP: analytically-optimal linear basis + small MLP.  Fast, sample-
  #          efficient.  Try this first.  Set n_modes using the explained-
  #          variance printout after the first epoch.
  #
  # CNNDecoder3D: 3-D convolutional decoder.  Good spatial inductive bias.
  #               Works on structured grids of any resolution.
  #
  # Also compatible (but less efficient on fixed mesh):
  #   FFNN | ResFFNN | DirectFieldNet | DeepONet | EfficientCoordinateNet
  #
  # NOT compatible:
  #   CNNDecoder          — fixed 1-D topology
  #   DeepSetsCoordinateNet — requires (A, center, sigma) triplets in P
  # ─────────────────────────────────────────────────────────────────────────
  type: "POD_MLP"
  hidden_dim: 256
  latent_dim: 128
  num_blocks: 4
  n_modes: 40           # POD_MLP only: number of POD modes to keep.
                        # Run once, check explained_variance_ratio_ printout,
                        # then increase/decrease as needed.
  base_ch: 128          # CNNDecoder3D only: channel width of widest conv layer
