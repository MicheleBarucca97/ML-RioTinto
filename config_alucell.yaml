# ==========================================================================
#  Alucell ML Surrogate — Training Configuration
# ==========================================================================
#
#  This config is read by train.py and evaluate.py.
#  Data is prepared beforehand by prepare_alucell.py.
#
#  The pipeline has two orthogonal choices:
#
#    1.  --mapping  (in prepare_alucell.py)
#          velocity_midacd   mid-ACD plane velocity      [M_mid x 3]
#          velocity_full     full 3D velocity field       [M_full x 3]
#          interface         interface displacement h     [M_int]
#
#    2.  --pod  (in prepare_alucell.py)
#          Without --pod:    raw field is stored as target
#          With --pod:       offline POD, coefficients as target [k]
#
#  The model type here must match the --pod flag:
#
#    +-------------------+------------------------------------------+
#    | prepare flags     | Recommended model                        |
#    +-------------------+------------------------------------------+
#    | no --pod          | POD_MLP   (POD done inside the model)    |
#    |                   | ResFFNN   (direct I -> field, no POD)    |
#    +-------------------+------------------------------------------+
#    | --pod             | ResFFNN   (I -> k coefficients)          |
#    |                   | Do NOT use POD_MLP (double POD!)         |
#    +-------------------+------------------------------------------+
#
#  Example commands:
#
#    # velocity_midacd, delta, POD_MLP handles reduction
#    python prepare_alucell.py --master runs/master_dataset.h5 \
#        --manifest runs/manifest.csv \
#        --mapping velocity_midacd --delta \
#        --output data/midacd_delta.h5
#    python train.py --config config_alucell.yaml
#
#    # velocity_full, delta + offline POD, ResFFNN on coefficients
#    python prepare_alucell.py --master runs/master_dataset.h5 \
#        --manifest runs/manifest.csv \
#        --mapping velocity_full --delta --pod --n-modes 50 \
#        --output data/full3d_pod_delta.h5
#    # (then set h5_path below and model.type to ResFFNN)
#    python train.py --config config_alucell.yaml
# ==========================================================================

benchmark: "alucell"
seed: 42

# --------------------------------------------------------------------------
# Data — dimensions are auto-detected from the HDF5 at runtime
# --------------------------------------------------------------------------
data:
  h5_path: "./data/full3d_pod_delta.h5"  # Change to your prepared dataset

  n_params: 24            # 24 anodes
  spatial_dim: 3         # dimension of the grid (2 for mid-ACD plane, 3 for full 3D)
  # M_out is read from the HDF5 automatically

  use_subset: no

# --------------------------------------------------------------------------
# Training
# --------------------------------------------------------------------------
training:
  epochs: 500
  batch_size: 16
  lr: 0.001
  weight_decay: 1.0e-4
  patience: 50
  num_workers: 4

  # Set to 0.0 for unstructured meshes or POD coefficients.
  grad_loss_weight: 0.0

# --------------------------------------------------------------------------
# Model
# --------------------------------------------------------------------------
model:
  type: "ResFFNN"   # Change to "ResFFNN" when using --pod data
  hidden_dim: 256
  num_blocks: 4
  n_modes: 40              # Only used by POD_MLP
  latent_dim: 128           # Only used by DeepONet