seed: 42

data:
  h5_path: "./data/gaussians.h5"
  n_gaussians: 10
  M: 256  # Output resolution
  x_min: -1.0
  x_max: 1.0
  samples:
    train: 100000
    val: 1000
    test: 1000

training:
  batch_size: 128
  epochs: 100
  lr: 1e-3
  num_workers: 4 # Parallel data loading
  accelerator: "auto" # Auto-selects GPU/MPS/CPU